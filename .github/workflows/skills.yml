name: skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Check README skills table is up to date
        run: node scripts/generate-readme.mjs --check

  generate:
    name: Regenerate skills table
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate README skills table
        run: node scripts/generate-readme.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: regenerate skills table"
          git push
